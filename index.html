<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<title>RESONANCE THE SERIES · Breakdown</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="RESONANCE">
<meta property="og:title" content="RESONANCE THE SERIES · Breakdown">
<meta property="og:description" content="ตารางถ่ายทำ Himeji 28 ก.ย. – 6 ต.ค. 2026 · 撮影ブレイクダウン">
<meta property="og:image" content="https://keetawatc-rgb.github.io/resonance-breakdown/brand/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2340; --ink-2:#4A5270; --ink-3:#7B8199;
  --paper:#F5F6F8; --surface:#FFFFFF; --line:#E1E4EA;
  --int-d:#FFFFFF; --ext-d:#F4D24B; --int-n:#6E8FDB; --ext-n:#4FA877; --fb:#C9B6E4;
  --meal:#F7C2A8; --meal-ink:#7A3A1C;
  --now:#E0463A; --changed:#C2410C; --changed-bg:#FFEDD5;
  --chip:#EEF0F5;
  --font-th:"Anuphan", "Noto Sans Thai", system-ui, sans-serif;
  --font-ja:"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EDEDEF; --ink-2:#B6B6BC; --ink-3:#86868E;
    --paper:#000000; --surface:#141416; --line:#2A2A2E;
    --int-d:#EDEDEF; --meal:#5A3526; --meal-ink:#F7C2A8;
    --changed:#FDBA74; --changed-bg:#43250F; --chip:#232326;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEDEF; --ink-2:#B6B6BC; --ink-3:#86868E;
  --paper:#000000; --surface:#141416; --line:#2A2A2E;
  --int-d:#EDEDEF; --meal:#5A3526; --meal-ink:#F7C2A8;
  --changed:#FDBA74; --changed-bg:#43250F; --chip:#232326;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-th);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body.ja{font-family:var(--font-ja)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--int-n);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.lang{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.days{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 11px;font-size:13px;cursor:pointer;text-align:left;line-height:1.25}
.day b{display:block;font-size:14px}
.day span{color:var(--ink-3);font-size:11.5px}
.day[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-current="true"] span{color:inherit;opacity:.75}
.day:disabled{opacity:.4;cursor:default}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* day header */
.dayhead{padding:18px 0 6px}
.dayhead h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700}
.dayhead .sub{color:var(--ink-2);font-size:14px}
.updated{display:inline-block;margin-top:8px;font-size:12px;color:var(--ink-3)}
.route{margin:14px 0 4px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 0;font-size:13.5px;font-weight:600}
.route li{display:flex;align-items:center}
.route li+li::before{content:"";width:14px;height:1px;background:var(--ink-3);margin:0 6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 6px}
.fact{background:var(--surface);padding:10px 12px}
.fact dt{font-size:11.5px;color:var(--ink-3)}
.fact dd{margin:0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.fact.wide{grid-column:1/-1}
.fact.warn dd{color:var(--changed)}
.fact a{font-weight:500;font-size:13px}

/* filters + legend */
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.bar .lbl{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.18)}

/* timeline */
.loc{margin:26px 0 0}
.loc-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.loc-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;display:grid;place-items:center;transform:translateY(3px)}
.loc-h h2{margin:0;font-size:19px;line-height:1.3}
.loc-meta{font-size:13px;color:var(--ink-2);margin:-4px 0 10px 36px}
.loc-meta a{font-weight:600}
.slot{margin:0 0 14px 36px}
.slot-t{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.slot-t .dur{font-weight:500;color:var(--ink-3)}
.nowtag{background:var(--now);color:#fff;border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:700}
.slot.is-now .scene{box-shadow:0 0 0 2px var(--now)}

.scene{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 8px}
.strip{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:12px;color:#1B2340;border-right:1px solid rgba(0,0,0,.08);text-align:center;line-height:1.1;padding:6px 0}
.strip small{font-weight:600;font-size:11px;opacity:.75}
.s-int-d{background:var(--int-d)} .s-ext-d{background:var(--ext-d)} .s-int-n{background:var(--int-n);color:#fff} .s-ext-n{background:var(--ext-n);color:#fff} .s-fb{background:var(--fb)}
.body{flex:1;min-width:0}
.sum{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer}
.sum-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sid{font-weight:700;font-size:15px}
.badge{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px}
.badge.chg{background:var(--changed-bg);color:var(--changed)}
.badge.fb{background:var(--chip);color:var(--ink-2)}
.place{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.desc{margin:6px 0 0;font-size:14.5px}
.scene:not(.open) .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cast{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cast span{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}
.more{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.det{display:none;border-top:1px dashed var(--line);padding:8px 12px 12px}
.scene.open .det{display:block}
.det dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.det dt{color:var(--ink-3);white-space:nowrap}
.det dd{margin:0}
.det .rmk{color:var(--changed);font-weight:600}

.meal{margin:22px 0 0;background:var(--meal);color:var(--meal-ink);border-radius:10px;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.wrapline{margin:26px 0 8px;text-align:center;font-weight:700;font-size:16px;padding:14px;border:2px dashed var(--line);border-radius:12px}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}

/* tables */
.sec{margin:22px 0 0}
.sec h2{font-size:18px;margin:0 0 4px}
.sec p.lead{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;background:var(--paper)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
ol.checks{margin:0;padding:0 0 0 20px;font-size:14px}
ol.checks li{margin:0 0 8px}
footer{margin:34px 0 26px;font-size:12px;color:var(--ink-3);text-align:center}
@media (min-width:560px){.dayhead h1{font-size:30px}.facts{grid-template-columns:repeat(4,1fr)}.fact.wide{grid-column:span 2}}
@media (prefers-reduced-motion:no-preference){.det{animation:none}}

.tools{display:flex;gap:6px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.sub2{font-size:13px;color:var(--ink-2);margin-top:2px}
.loc.planb .loc-h h2::after{content:"PLAN B";margin-left:8px;font-size:11px;font-weight:700;background:var(--ink);color:var(--paper);padding:1px 6px;border-radius:4px;vertical-align:3px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet-in h3{margin:0 0 4px;font-size:17px}
.sheet-in p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.linkbox{display:flex;gap:6px}
.linkbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.sheet-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.s-ev{background:#F2A65A}

.wx-cond{font-weight:700}
.fact.wx-bad dd .wx-cond{color:var(--changed)}
.wx-bars{display:flex;gap:6px;margin:10px 0 4px;height:74px;align-items:flex-end}
.wx-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;font-weight:500}
.wx-fill{width:100%;max-width:44px;background:var(--int-n);border-radius:4px 4px 0 0;opacity:.85}
.wx-b span{font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.wx-b small{font-size:10.5px;color:var(--ink-3)}
.wx-note{margin:8px 0 0;font-size:13px;font-weight:500;line-height:1.5}
.fact.wx-bad .wx-note{color:var(--changed)}
.wx-src{margin:6px 0 0;font-size:11.5px;color:var(--ink-3);font-weight:400}
.wx-src a{font-size:11.5px}
.wx-alert{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--changed-bg);color:var(--changed);font-size:13px;font-weight:600;line-height:1.45}

.bs-lead{margin-top:16px}
.bs-loc{margin-top:22px}
.bs-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bs-head h2{display:flex;align-items:center;gap:8px;font-size:17px;margin:0}
.bs-head .loc-n{transform:none;width:24px;height:24px;font-size:12px}
.bs-head .pb{font-size:11px;background:var(--ink);color:var(--paper);padding:1px 6px;border-radius:4px}
.bs-count{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.bs-actions{display:flex;gap:6px;margin:10px 0}
.bs-pick{font-size:13px;padding:7px 12px;display:inline-flex;align-items:center}
.bs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
@media (min-width:560px){.bs-grid{grid-template-columns:repeat(4,1fr)}}
.bs-th{border:0;padding:0;background:var(--chip);aspect-ratio:1/1;overflow:hidden;border-radius:6px;cursor:pointer;display:block;width:100%}
.bs-th img{width:100%;height:100%;object-fit:cover;display:block}
.bs-empty{margin:8px 0 0;font-size:13.5px;color:var(--ink-3);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}
.bs-prog{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13.5px;font-weight:600}
.bs-tip{margin-top:18px;font-size:12.5px}
.bs-strip{display:flex;gap:4px;margin:0 0 12px 36px;overflow-x:auto;scrollbar-width:none}
.bs-strip::-webkit-scrollbar{display:none}
.bs-th.sm{flex:0 0 64px;width:64px;height:64px}
.bs-more{flex:0 0 64px;height:64px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700;cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb.open{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;gap:8px}
.lb-cap{font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-btn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;height:36px;min-width:36px;padding:0 12px;font-size:14px;font-weight:600;cursor:pointer}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:22px}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-bot{display:flex;justify-content:center;padding:10px}
.lb-del{background:rgba(224,70,58,.9)}

/* costume */
.cb-strip{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.cb-mini{flex:0 0 auto;border:0;padding:0;background:var(--chip);border-radius:8px;overflow:hidden;cursor:pointer;position:relative;width:52px;height:72px}
.cb-mini img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cb-mini span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;text-align:center;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-lead{margin-top:10px}
.cb-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 10px}
.cb-ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cb-ch .sid{font-weight:700}
.cb-time{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cb-ward{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.cb-ward span{display:inline-block;background:var(--chip);border-radius:4px;padding:0 6px;margin-right:6px;font-size:11px;font-weight:700;color:var(--ink-3)}
.cb-look{margin-top:10px}
.sec>.cb-look{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px}
.cb-lh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-bottom:6px}
.cb-lh b{font-size:15px}
.cb-lh small{color:var(--ink-3);font-size:12.5px}
.cb-tag{border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--chip)}
.cb-oe{background:#FDE2E4;color:#9D2335} .cb-fem{background:#DCEBFF;color:#1E4E9C}
[data-theme="dark"] .cb-oe{background:#4A1F27;color:#FBC6CD} [data-theme="dark"] .cb-fem{background:#1C2F52;color:#BFD6FF}
.cb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:560px){.cb-grid{grid-template-columns:repeat(4,1fr)}}
.cb-ph{border:0;padding:0;background:var(--chip);aspect-ratio:3/4;border-radius:8px;overflow:hidden;cursor:pointer}
.cb-ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cb-notes{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.cb-notes li{background:#FFF4B8;color:#5B4A00;border-radius:6px;padding:4px 8px;font-size:13px}
[data-theme="dark"] .cb-notes li{background:#3D3510;color:#F5E58C}
.cb-scn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.cb-scn .lbl{font-size:12px;color:var(--ink-3)}
.cb-go{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.cb-go i{font-style:normal;color:var(--ink-3);margin-left:2px}
.cb-off{border:1px dashed var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink-3)}
.tabs button{font-size:13px}
.cb-mini span.cb-oe{background:#FDE2E4;color:#9D2335} .cb-mini span.cb-fem{background:#DCEBFF;color:#1E4E9C}
.sec h2 .loc-n{display:inline-grid;transform:translateY(-2px);margin-right:4px;vertical-align:middle}
.mapbtn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;align-self:center}
.mapbtn svg{width:15px;height:15px;color:#E0463A}
.mapbtn:active{background:var(--chip)}
.bs-map{margin:-2px 0 8px}
.bs-map .mapbtn{margin-left:0}
.mapctl{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.mapctl .mapbtn{margin-left:0}
.mapedit{border:0;background:none;color:var(--ink-3);font-size:12.5px;font-weight:600;padding:4px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.loc-h+.bs-map{margin:-4px 0 8px 36px}

/* vans */
.van-q{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;margin:0 0 10px}
.vans{display:grid;gap:10px}
@media (min-width:640px){.vans{grid-template-columns:1fr 1fr}}
.van{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--van);border-radius:12px;overflow:hidden}
.van-h{display:flex;align-items:baseline;gap:10px;padding:9px 12px;background:color-mix(in srgb,var(--van) 16%,var(--surface))}
.van-h b{font-size:16px}
.van-h span{font-size:13px;color:var(--ink-2)}
.van-h small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.van ul{list-style:none;margin:0;padding:4px 12px 8px}
.van li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.van li:last-child{border-bottom:0}
.van li span{color:var(--ink-3);font-size:12.5px;flex:0 0 46%}
.van li i{font-style:normal;color:var(--ink-3);font-size:12px}
.van li.hit{background:#FFF4B8;margin:0 -12px;padding:5px 12px}
[data-theme="dark"] .van li.hit{background:#3D3510}

/* shooting board */
.sb-tag{display:inline-block;margin:2px 0 4px;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.sb-grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:8px 0 10px}
.sb-h{display:flex;flex-wrap:wrap;gap:4px 10px}
.sb-h .sid{font-weight:700}
.sb-desc{margin:4px 0 8px;font-size:13.5px;color:var(--ink-2)}
.sb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:640px){.sb-grid{grid-template-columns:repeat(3,1fr)}}
.sb-th{position:relative;border:0;padding:0;background:var(--chip);aspect-ratio:16/10;border-radius:6px;overflow:hidden;cursor:pointer}
.sb-th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sb-th b{position:absolute;left:0;top:0;background:#000;color:#fff;font-size:12px;padding:1px 6px;border-bottom-right-radius:6px}
.sb-mini{width:84px;height:56px}
.bs-fold{margin-top:8px}
.bs-fold summary{cursor:pointer;font-size:13px;color:var(--ink-3);font-weight:600;padding:6px 0}

/* tabs: 6 tabs scroll on narrow screens */
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:10px 9px;white-space:nowrap}

/* script */
.scr-row{padding:0 12px 8px}
.scr-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.sc-jump{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.sc-jump button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.sc-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:12px 0;scroll-margin-top:130px}
.sc-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.sc-head .sid{font-weight:700;font-size:16px}
.sc-day{background:var(--chip);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-2)}
.sc-place{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.sc-chars{font-size:13px;color:var(--ink-2);margin-top:4px}
.sc-chars span{color:var(--ink-3)}
.sc-body{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:15px;line-height:1.65}
.sc-a{margin:6px 0;color:var(--ink-2)}
.sc-d{margin:8px 0 8px 14px;padding-left:10px;border-left:3px solid var(--line)}
.sc-d b{display:block;font-size:12.5px;letter-spacing:.02em;color:var(--ink-3)}
.sc-d div{color:var(--ink)}
.sc-d.w-oe{border-left-color:#F2A7B1} .sc-d.w-fem{border-left-color:#9DBEF0}
.sc-d.hl{background:#FFF4B8;border-radius:0 6px 6px 0;padding:4px 8px 4px 10px}
[data-theme="dark"] .sc-d.hl{background:#3D3510}
.sc-t{text-align:right;font-size:12px;font-weight:700;color:var(--ink-3);margin:8px 0 0}
.scr-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none;align-items:flex-end;justify-content:center}
.scr-modal.open{display:flex}
.scr-in{background:var(--paper);width:100%;max-width:760px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.scr-modal{align-items:center}.scr-in{border-radius:16px;max-height:88vh}}
.scr-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 16px;border-bottom:1px solid var(--line)}
.scr-x{background:var(--chip);color:var(--ink)}
.scr-scroll{overflow-y:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch}
.scr-go{text-align:right;margin:-4px 0 8px}
.ep-sel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.ep-sel button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer}
.ep-sel button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sc-tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:auto}

/* scene details toggle: big, obvious tap target */
.more-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:2px 12px 12px;min-height:44px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.more-btn i{font-style:normal;font-size:14px;transition:transform .2s}
.more-btn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.more-btn[aria-expanded="true"] i{transform:rotate(180deg)}
.more-btn:active{transform:scale(.98)}
.scene.open .det{border-top:0;padding-top:0}

/* ---- compact header + day summary ---- */
.top-row{padding:8px 0 6px;gap:8px}
.brand{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{font-size:11px}
.tools{flex:0 0 auto;gap:5px}
.iconbtn{height:34px;min-width:34px;padding:0 9px}
.lang button{white-space:nowrap;padding:6px 10px;font-size:13px}
@media (max-width:480px){ #shareBtn span{display:none} #shareBtn{padding:0} .brand{font-size:13px} }
.dayhead{padding:12px 0 4px}
.dayhead h1{font-size:21px;margin:0 0 2px}
.dayhead .sub{font-size:13px;color:var(--ink-2)}
.dayhead .sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.dayhead .upd{color:var(--ink-3)}
.route{margin:10px 0 0;gap:6px;font-size:12.5px}
.route li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;gap:6px}
.route li+li::before{display:none}
.route li i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0 8px}
.stats div{background:var(--surface);padding:8px 10px}
.stats span{display:block;font-size:11px;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{font-size:18px;font-variant-numeric:tabular-nums}
.stats b small{font-size:13px;color:var(--ink-3);font-weight:600}
.wx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.wx.warn{color:var(--changed);font-size:13.5px}
.wx-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:14px}
.wx-cond{font-weight:700}
.wx-bad .wx-cond{color:var(--changed)}
.wx-pop{font-weight:600;font-variant-numeric:tabular-nums}
.wx-sun{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wx-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 0;height:auto}
.wx-b{position:relative;display:flex;justify-content:space-between;align-items:center;padding:5px 7px;border-radius:6px;overflow:hidden;background:var(--chip);font-variant-numeric:tabular-nums;height:auto}
.wx-b::before{content:"";position:absolute;inset:0;right:auto;width:calc(var(--p) * 1%);background:var(--int-n);opacity:.28}
.wx-b small{position:relative;font-size:10.5px;color:var(--ink-3)}
.wx-b span{position:relative;font-size:12px;font-weight:700;margin:0}
.wx-note{margin:8px 0 0;font-size:12.5px;line-height:1.5;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wx-bad .wx-note{color:var(--changed)}
.wx-note.full{-webkit-line-clamp:unset}
.wx-src{margin:6px 0 0;font-size:11px;color:var(--ink-3);line-height:1.45}
.wx-alert{margin:0 0 8px;padding:0;border-radius:10px;background:var(--changed-bg);color:var(--changed);font-size:13px;font-weight:600}
.wx-alert summary{cursor:pointer;padding:9px 12px;list-style:none}
.wx-alert summary::-webkit-details-marker{display:none}
.wx-alert p{margin:0;padding:0 12px 10px;font-weight:500;line-height:1.5}
.hosp{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:13px}
.hosp span{color:var(--ink-3);white-space:nowrap}
.hosp b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hosp i{font-style:normal;color:var(--ink-3);font-size:18px}
@media (min-width:560px){.dayhead h1{font-size:24px}}
.brand{font-size:16px;letter-spacing:.06em}
.brand small{letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){ .brand{font-size:15px} }

/* brand logos (alpha masks, follow theme colour) */
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .logo{display:block;height:34px;aspect-ratio:833/224;background:var(--ink);-webkit-mask:url(brand/resonance.png) left center/contain no-repeat;mask:url(brand/resonance.png) left center/contain no-repeat}
.brand small{font-size:10.5px;letter-spacing:.02em;padding-left:2px}
@media (max-width:480px){ .brand .logo{height:30px} }
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 14px 36px;margin-top:24px;border-top:1px solid var(--line)}
.foot .vc{display:block;height:30px;aspect-ratio:600/327;background:var(--ink-3);-webkit-mask:url(brand/velcurve.png) center/contain no-repeat;mask:url(brand/velcurve.png) center/contain no-repeat;opacity:.85}
.foot p{margin:0;text-align:center;font-size:11.5px;color:var(--ink-3);line-height:1.5;max-width:460px}
.brand .logo{height:42px}
@media (max-width:480px){ .brand .logo{height:38px} .brand small{font-size:10px} }
.wx-live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#16A34A;letter-spacing:.02em;margin-bottom:4px}
.wx-live i{width:7px;height:7px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.wx-now{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.wx-now b{font-size:16px;color:var(--ink)}
.wx-note small{font-weight:600;opacity:.75}
.wx-alert.ok{background:rgba(22,163,74,.12);color:#15803D;padding:9px 12px}
.wx-alert.ok small,.wx-alert small{font-weight:500;opacity:.8}
.wx-alert.red{background:#FEE2E2;color:#B91C1C}
[data-theme="dark"] .wx-alert.ok{color:#4ADE80} [data-theme="dark"] .wx-alert.red{background:#450A0A;color:#FCA5A5}

/* emergency + prep */
.quick{display:flex;gap:6px;margin:0 0 8px}
.sos-btn,.prep-btn{flex:1;min-height:40px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.sos-btn{border:0;background:#DC2626;color:#fff}
.prep-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prep-btn b{display:inline-block;min-width:20px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:11.5px;padding:0 6px;margin-left:4px}
.sos-row{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.sos-row.big{border-color:#FCA5A5}
.sos-tel{flex:0 0 auto;min-width:64px;text-align:center;border-radius:10px;background:#DC2626;color:#fff;font-weight:800;font-size:15px;padding:8px 10px;text-decoration:none;font-variant-numeric:tabular-nums}
.sos-row:not(.big) .sos-tel{background:var(--ink);color:var(--paper);font-size:13px;min-width:0}
.sos-row.big .sos-tel{font-size:22px;min-width:78px}
.sos-txt{min-width:0}
.sos-txt b{display:block;font-size:14px}
.sos-txt small{display:block;font-size:12px;color:var(--ink-2);line-height:1.45}
.sos-more{display:flex;gap:12px;margin-top:4px;font-size:12.5px}
.ph{font-size:14px;margin:12px 0 6px}
.ph.miss{color:var(--changed)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pi{background:var(--surface);border:1px solid var(--line);border-left:4px solid #16A34A;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.5}
.pi-miss{border-left-color:var(--changed)}
.pt{display:inline-block;margin-right:6px;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;background:var(--chip);color:var(--ink-2);vertical-align:1px}
.pt-art{background:#FEF3C7;color:#92400E} .pt-ward{background:#FCE7F3;color:#9D174D} .pt-cam{background:#DBEAFE;color:#1E40AF} .pt-cast{background:#EDE9FE;color:#5B21B6} .pt-post{background:#CCFBF1;color:#115E59} .pt-prod{background:#E5E7EB;color:#1F2937}
[data-theme="dark"] .pt{filter:brightness(.85) saturate(1.2)}
.pall{margin-top:12px}
.pall summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:6px 0}

/* ================= responsive: tablet + desktop ================= */
.dh-grid{display:block}
@media (min-width:768px){
  .wrap{max-width:none;padding:0 24px}
  .bs-grid{grid-template-columns:repeat(5,1fr)}
  .cb-grid{grid-template-columns:repeat(5,1fr)}
  .sb-grid{grid-template-columns:repeat(3,1fr)}
  .vans{grid-template-columns:1fr 1fr}
  .stats b{font-size:20px}
  .dayhead h1{font-size:26px}
  .sc-body{font-size:15.5px}
  .scene .body{padding-right:4px}
}
@media (min-width:1000px){
  .wrap{max-width:1240px;padding:0 28px}
  .top .wrap{max-width:1240px}
  .dh-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"a b" "c b";grid-template-rows:auto 1fr;gap:0 16px;align-items:start;margin-top:12px}
  .dh-a{grid-area:a} .dh-b{grid-area:b} .dh-c{grid-area:c}
  .dh-a .stats{margin-top:0}
  .dh-b .wx{margin:0 0 8px}
  /* scenes two per row inside a time slot */
  .slot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:stretch}
  .slot>.scene{margin-bottom:12px}
  .slot>.slot-t{grid-column:1/-1}
  .bs-grid{grid-template-columns:repeat(6,1fr)}
  .cb-grid{grid-template-columns:repeat(6,1fr)}
  .sb-grid{grid-template-columns:repeat(4,1fr)}
  .vans{grid-template-columns:repeat(3,1fr)}
  .cb-card{display:inline-block;width:calc(50% - 8px);vertical-align:top;margin-right:12px}
  .cb-card:nth-of-type(2n){margin-right:0}
  .sb-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  .sec>.cb-look{display:inline-block;width:calc(50% - 8px);vertical-align:top;margin-right:12px}
  .sec>.cb-look:nth-of-type(2n){margin-right:0}
  .sc-card{max-width:900px}
  .plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sos-sec{columns:2;column-gap:12px}
  .sos-sec h2,.sos-sec .lead{column-span:all}
  .sos-row{break-inside:avoid}
  .tabs button{font-size:14px}
}
@media (min-width:1600px){ .wrap,.top .wrap{max-width:1440px} .bs-grid,.cb-grid{grid-template-columns:repeat(8,1fr)} }
.sb-tag{display:table}

@media (min-width:1000px){
  /* compact sticky header: tabs left-aligned, sized to content */
  .tabs{justify-content:flex-start;gap:4px;border-top:0}
  .tabs button{flex:0 0 auto;padding:12px 18px}
  .top-row{padding:10px 0 6px}
  .days{padding-bottom:8px}
  .day{padding:5px 13px}
  .dh-c .wx-alert{margin:0 0 8px}
  .dayhead{padding-top:18px}
  .dayhead h1{font-size:28px}
  .loc{margin-top:28px}
  .scene{height:calc(100% - 12px)}
}
@media (min-width:1500px){ .slot{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1000px){
  .slot>.scene .body{display:flex;flex-direction:column;min-width:0}
  .slot>.scene .more-btn{margin-top:auto}
}

/* shooting-board thumbnails inside scene cards: wrap, never clip */
.sb-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:0 12px 10px}
.sb-mini{position:relative;border:0;padding:0;background:var(--chip);aspect-ratio:16/10;border-radius:6px;overflow:hidden;cursor:pointer;width:100%;height:auto}
.sb-mini img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.sb-mini b{position:absolute;left:0;top:0;min-width:22px;height:20px;padding:0 4px;display:grid;place-items:center;background:#000;color:#fff;font-size:11px;font-weight:700;border-bottom-right-radius:6px}
.sb-more i{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-weight:800;font-size:16px}
.sb-th b{min-width:26px;height:22px;display:grid;place-items:center}
@media (max-width:480px){ .sb-strip{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px} .sb-mini b{min-width:18px;height:16px;font-size:10px} }
.park{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:0 0 10px;font-size:13px}
.loc-h+.bs-map+.park{margin-left:36px}
.park-i{font-size:14px}
.park-t{color:var(--ink)}
.park-t.muted{color:var(--ink-3)}
.park.set .park-t{font-weight:600}
.park-a{font-weight:600;font-size:12.5px}
.bs-trash{margin-top:28px;border-top:1px dashed var(--line);padding-top:12px}
.bs-trash summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.tr-item{display:flex;flex-direction:column;gap:4px}
.tr-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;opacity:.6}
.tr-item .btn{padding:4px 6px;font-size:12px}
.offline{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translate(-50%,-150%);z-index:70;background:#B45309;color:#fff;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;transition:transform .25s;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:calc(100% - 24px);text-align:center}
.offline.show{transform:translate(-50%,0)}

/* 4. change badges */
.badge.new{background:#DCFCE7;color:#166534}
[data-theme="dark"] .badge.new{background:#14532D;color:#BBF7D0}
.chg-banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#DCFCE7;color:#166534;border:1px solid #86EFAC;border-radius:12px;padding:10px 12px;margin:14px 0 4px;font-size:13.5px;font-weight:600}
[data-theme="dark"] .chg-banner{background:#052E16;color:#BBF7D0;border-color:#166534}
.chg-banner .btn{flex:0 0 auto;padding:6px 12px;font-size:13px}
/* 5. prep ticks */
.pi{display:flex;gap:10px;align-items:flex-start}
.pchk{flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:2px solid var(--ink-3);background:var(--surface);color:#fff;font-weight:900;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.pi.done .pchk{background:#16A34A;border-color:#16A34A}
.pi.done>div{text-decoration:line-through;opacity:.55}

const store = {

};

if(!["th","ja","en"].includes(lang)) lang="th";
const LOC=()=>lang==="ja"?"ja-JP":lang==="en"?"en-GB":"th-TH";
let theme = store.get("rsn-theme") === "dark" ? "dark" : "light";

function t(o){ return o==null ? "" : (typeof o==="string" ? o : (o[lang] ?? o.th)); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tokyoDate(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function tokyoMinutes(){ const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()); return (+p.find(x=>x.type==="hour").value)*60+(+p.find(x=>x.type==="minute").value); }
function mins(s){ const [h,m]=s.split(":"); return (+h)*60+(+m); }
function fmtDate(iso,wd){ const d=new Date(iso+"T12:00:00+09:00"); return new Intl.DateTimeFormat(LOC(),{year:"numeric",month:"long",day:"numeric",weekday:wd?(lang==="ja"?"short":"long"):undefined,timeZone:"Asia/Tokyo"}).format(d); }
function fmtShort(iso){ const d=new Date(iso+"T12:00:00+09:00"); return new Intl.DateTimeFormat(LOC(),{month:"short",day:"numeric",timeZone:"Asia/Tokyo"}).format(d); }
function stripClass(sc){
  const dn=sc.dn||"";
  if(sc.fb || /FB/.test(dn)) return "s-fb";
  if(/EV/.test(dn)) return "s-ev";
  const night = /^N$|DFN|NFD/.test(dn);
  return "s-"+(sc.ie==="EXT"?"ext":"int")+"-"+(night?"n":"d");
}
function defaultDay(){
  const q=parseInt(qs.get("day"),10);

  return hit?hit.day:DAYS[DAYS.length-1].day;
}

async function editPark(b){
  const k=b.dataset.parkedit, cur=PARK[k]||{};
  let url=prompt(t(UI.parkPromptUrl).replace("{n}",b.dataset.name), cur.url||""); if(url===null) return;

  let note=prompt(t(UI.parkPromptNote), cur.note||""); if(note===null) return; note=note.trim().slice(0,300);

    else{ await sbFetch("/rest/v1/locparking",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({key:k,url:url||null,note:note||null,updated_at:new Date().toISOString()})});
      PARK[k]={key:k,url,note}; toast(t(UI.parkSaved)); }
    render();
  }catch(e){ toast(t(UI.mapErr)); }
}

function trainBlock(d,item){
  if(typeof TRAINS==="undefined") return "";
  const T=TRAINS.find(x=>x.day===d.day&&x.loc===item.name.en); if(!T) return "";
  const slots=item.slots.filter(s=>s.scenes.some(sc=>/train/i.test((sc.place&&sc.place.en)||"")));
  const fit=r=>r.seat!=="△"&&slots.some(s=>mins(r.hD)<mins(s.end)&&mins(r.oA)>mins(s.start));
  const U=UI.train;
  return `<details class="train" open><summary>🚃 ${esc(t(U.h))} — ${esc(t(T.line))}</summary>
    <div class="train-clock" data-date="${d.date}"></div>
    <div class="train-scroll"><table><thead><tr><th>${t(U.no)}</th><th class="go">${t(U.go)}<small>${t(U.goS)}</small></th><th class="go">${t(U.arr)}<small>Oshio</small></th><th class="back">${t(U.local)}<small>→ ${t(U.him)}</small></th><th class="back">${t(U.exp)}<small>→ ${t(U.him)}</small></th></tr></thead><tbody>
    ${T.rows.map(r=>`<tr class="${r.seat==="△"?"bad":""}${fit(r)?" fit":""}" data-tr="${[r.hA,r.hD,r.oA,r.hR].join(" ")}"><td><b>${r.no}</b> <span class="seat">${r.seat}</span>${fit(r)?` <span class="fit-tag">${t(U.fit)}</span>`:""}</td><td class="go"><small>${r.hA} →</small> <b>${r.hD}</b></td><td class="go">${r.oA}</td><td class="back">${r.oD} → ${r.hR}</td><td class="back">${r.xD} → ${r.xA}</td></tr><tr class="st"><td colspan="5"></td></tr>`).join("")}
    </tbody></table></div>
    <ul class="train-leg">${Object.entries(T.seats).map(([k,v])=>`<li class="${k==="△"?"bad":""}"><span class="seat">${k}</span> ${esc(t(v))}</li>`).join("")}</ul>
    <p class="train-note"><span class="sw go"></span>${t(U.goL)} <span class="sw back"></span>${t(U.backL)}<br>${esc(t(T.note))}</p></details>`;
}
function tokyoSecs(){ const q=qs.get("trainnow"); if(q) return mins(q)*60; const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date()); const g=k=>+p.find(x=>x.type===k).value; return g("hour")*3600+g("minute")*60+g("second"); }
function durTxt(sec){ const m=Math.ceil(sec/60); if(m<60) return t(UI.train.min).replace("{m}",m); return t(UI.train.hm).replace("{h}",Math.floor(m/60)).replace("{m}",m%60); }
function tickTrains(){
  const boxes=document.querySelectorAll(".train"); if(!boxes.length) return;
  const U=UI.train, now=tokyoSecs(), hh=n=>String(n).padStart(2,"0");
  const clock=`${hh(Math.floor(now/3600)%24)}:${hh(Math.floor(now/60)%60)}:${hh(now%60)}`;
  boxes.forEach(box=>{
    const c=box.querySelector(".train-clock"), today=qs.get("trainnow")||c.dataset.date===tokyoDate();
    c.innerHTML=`🕒 ${t(U.nowL)} <b>${clock}</b> <small>JST</small>${today?"":` · <span class="muted">${esc(t(U.notToday).replace("{d}",fmtDate(c.dataset.date,false)))}</span>`}`;
    let next=null;
    box.querySelectorAll("tr[data-tr]").forEach(tr=>{

let CUR_LOC="";

function hashKey(str){ let h=5381; for(const c of str) h=((h<<5)+h+c.codePointAt(0))>>>0; return "l"+h.toString(36); }
function dayLocs(d){
  const seen=new Map();
  d.timeline.filter(x=>x.type==="loc").forEach(l=>{ const k=hashKey(l.name.th); if(!seen.has(k)) seen.set(k,{key:k,name:l.name,planB:l.planB,map:l.map}); else if(!seen.get(k).map) seen.get(k).map=l.map; });
  return [...seen.values()];
}
function natCmp(a,b){ return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:"base"}); }
function shotsFor(day,key){ return SHOTS.filter(x=>x.day===day&&x.loc===key).sort((a,b)=>natCmp(a.name,b.name)||natCmp(a.id,b.id)); }
function blobUrl(id){ return SB ? `${SB.url}/storage/v1/object/public/blockshots/${id}` : "/_blob/"+id; }

/* Supabase backend (own hosting): same shape as the claude.ai db/assets namespaces */
function sbHead(extra){ const h={apikey:SB.key}; if(/^eyJ/.test(SB.key)) h.Authorization="Bearer "+SB.key; return Object.assign(h,extra||{}); }
async function sbFetch(path,opt){ const r=await fetch(SB.url+path,Object.assign({},opt,{headers:sbHead(opt&&opt.headers)})); if(!r.ok){ const e=new Error(await r.text()); e.code="http_"+r.status; throw e; } return r; }
function sbBackend(){
  let listener=null, timer=null, last=null;
  let stamp=null;
  const refresh=async()=>{ try{
    // cheap change check (row count + newest row) before pulling the full list
    const h=await sbFetch("/rest/v1/blockshots?select=id,added_at&deleted_at=is.null&order=added_at.desc&limit=1",{headers:{Prefer:"count=exact"}});
    const h2=await sbFetch("/rest/v1/blockshots?select=deleted_at&deleted_at=not.is.null&order=deleted_at.desc&limit=1",{headers:{Prefer:"count=exact"}});
    const st=(h.headers.get("content-range")||"")+JSON.stringify(await h.json())+(h2.headers.get("content-range")||"")+JSON.stringify(await h2.json()); if(st===stamp&&last!==null) return;
    const rows=[]; for(let off=0;;off+=1000){ const r=await sbFetch(`/rest/v1/blockshots?select=id,day,loc,asset,name,deleted_at&order=id.asc&offset=${off}&limit=1000`); const part=await r.json(); rows.push(...part); if(part.length<1000) break; }
    stamp=st;
    const sig=JSON.stringify(rows); if(sig===last) return; last=sig;
    listener&&listener.ok({docs:rows.map(v=>({id:v.id,data:()=>v}))}); }catch(e){ if(last===null) listener&&listener.err(e); } };
  const db={ collection:()=>({
    onSnapshot(ok,err){ listener={ok,err}; refresh(); timer=setInterval(()=>{ if(!document.hidden) refresh(); },15000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); }); return ()=>clearInterval(timer); },
    doc:id=>({
      set:async v=>{ await sbFetch("/rest/v1/blockshots",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({id,day:v.day,loc:v.loc,asset:v.asset,name:v.name})}); refresh(); },
      delete:async()=>{ await sbFetch("/rest/v1/blockshots?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({deleted_at:new Date().toISOString()})}); refresh(); },
      restore:async()=>{ await sbFetch("/rest/v1/blockshots?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({deleted_at:null})}); refresh(); }
    })
  })};
  const assets={
    upload:async blob=>{ const id=`d${dayNo}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.jpg`;
      await sbFetch("/storage/v1/object/blockshots/"+id,{method:"POST",headers:{"Content-Type":blob.type||"image/jpeg","x-upsert":"false"},body:blob}); return {id}; },
    delete:async id=>{ /* soft delete: files are kept so photos can be restored from the trash */ }
  };
  return {db,assets};
}

async function toJpeg(file){
  try{
    const bmp=await createImageBitmap(file);
    const max=2000, sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); bmp.close&&bmp.close();
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    if(blob) return blob;
  }catch(e){}
  const ok=["image/jpeg","image/png","image/webp","image/gif"];
  return ok.includes(file.type)&&file.size<20*1024*1024 ? file : null;
}

  let okN=0, skip=0, lastErr="";
  for(let i=0;i<files.length;i++){

    const f=files[i];

    try{

      catch(e){ if(e&&e.code==="store_unavailable"){ await new Promise(z=>setTimeout(z,1500)); r=await ASSETS.upload(blob,{type:blob.type||"image/jpeg"}); } else throw e; }
      await DB.collection("blockshots").doc(`d${dayNo}-${key}-${r.id}`).set({day:dayNo, loc:key, asset:r.id, name:f.name, addedAt:new Date().toISOString()});

function blobBuf(b){ return b.arrayBuffer ? b.arrayBuffer() : new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsArrayBuffer(b); }); }
/* minimal ZIP writer (store, no compression) */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){ // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+sz;
  }
  const csz=central.reduce((a,x)=>a+x.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/zip"});
}

const CHG_FIELDS=["time","ie","dn","place","desc","cast","support","art","ward","remark"];
function sceneSig(sc,s){ const v=x=>x==null?"":typeof x==="string"?x:(x.th||"")+"|"+(Array.isArray(x)?x.join(","):""); return {time:s.start+"-"+s.end,ie:sc.ie,dn:sc.dn,place:v(sc.place),desc:v(sc.desc),cast:(sc.cast||[]).join(","),support:v(sc.support),art:v(sc.art),ward:v(sc.ward),remark:v(sc.remark)}; }
function daySigs(d){ const m={}; d.timeline.forEach(it=>(it.slots||[]).forEach(s=>s.scenes.forEach(sc=>{ let k=sc.id+"@"+(it.name.th||""); while(m[k]) k+="'"; m[k]=sceneSig(sc,s); }))); return m; }
let CHG={}; // day -> {sceneKey: [changed fields] | "new"}, plus _removed list
function computeChanges(){
  CHG={};
  DAYS.forEach(d=>{ const now=daySigs(d); let prev=null; try{ prev=JSON.parse(store.get("rsn-seen-"+d.day)||"null"); }catch(e){}
    if(!prev){ store.set("rsn-seen-"+d.day,JSON.stringify(now)); return; }
    const c={}, removed=[]; let n=0;
    // pair scenes by id@location; when an id repeats at one location, pair identical content first, then by order
    const base=k=>k.replace(/'+$/,""), groups={};
    Object.keys(now).forEach(k=>(groups[base(k)]=groups[base(k)]||{now:[],prev:[]}).now.push(k));
    Object.keys(prev).forEach(k=>(groups[base(k)]=groups[base(k)]||{now:[],prev:[]}).prev.push(k));
    Object.values(groups).forEach(g=>{
      const pairs=[], P=[...g.prev];
      g.now.forEach(k=>{ const i=P.findIndex(q=>prev[q].desc===now[k].desc&&prev[q].place===now[k].place); if(i>=0){ pairs.push([k,P[i]]); P.splice(i,1); } else pairs.push([k,null]); });
      pairs.forEach(pr=>{ if(!pr[1]&&P.length&&g.now.length===g.prev.length) pr[1]=P.shift(); });
      pairs.forEach(([k,q])=>{ if(!q){ c[k]="new"; n++; return; } const f=CHG_FIELDS.filter(x=>prev[q][x]!==now[k][x]); if(f.length){ c[k]=f; n++; } });
      P.forEach(q=>{ removed.push(q.split("@")[0]); n++; });
    });
    if(n){ c._removed=removed; c._n=n; CHG[d.day]=c; } });
}

    <div class="sum-pct"><b>${pct}%</b>${bar(T)}</div>
    <p class="sum-note">${t(U.rowsNote)}</p></section>`;
  h+=`<section class="sec"><h2>📅 ${t(U.byDay)}</h2><div class="sum-days">${DAYS.map(d=>{ const c=cnt(all.filter(x=>x._day===d.day)); const isT=d.date===tokyoDate();
    return `<button type="button" class="sum-day${isT?" today":""}${c.ns?" has-ns":""}" data-sumday="${d.day}"><div class="sd-h"><b>${t(UI.day)} ${d.day}</b><span>${esc(fmtShort(d.date))}</span>${c.n&&c.done===c.n?`<span class="sd-ok">✓</span>`:""}</div>
      ${bar(c)}<div class="sd-n"><span class="c-done">✓ ${c.done}</span><span class="c-ns">✕ ${c.ns}</span><span class="c-p">· ${c.pend}</span><span class="c-t">/ ${c.n}</span></div></button>`; }).join("")}</div>
    <div class="sum-leg"><span><i class="b-done"></i>${t(U.shot)}</span><span><i class="b-ns"></i>${t(U.notL)}</span><span><i></i>${t(U.pend)}</span></div></section>`;
  h+=seriesSec(all,S);
  h+=notShotSec(null);
  return h;
}
/* whole series by script scene number (EP.1–10): which script scenes are on the Himeji schedule, shot, or not scheduled here */
function seriesSec(all,S){
  if(typeof SCRIPT_SCENES==="undefined") return "";
  const U=UI.st, cov={};
  all.forEach(x=>sceneKeys(x.id).forEach(k=>(cov[k]=cov[k]||[]).push(x)));
  const AL=typeof SCENE_ALIAS!=="undefined"?SCENE_ALIAS:{}, heads={};
  Object.values(SCRIPT_SCENES).forEach(a=>a.forEach(sc=>heads[sc[0]]=sc[1]));
  const refOf=id=>{ const h=heads[id]||""; if(!/FLASH/i.test(h)) return null; const m=/EP\.?\s*(\d+)\s*SC\.?\s*(\d+[A-Z]?)/i.exec(h.replace(/^\(Sc\.\d+/i,"(")); return m?`EP.${m[1]} SC.${m[2].toUpperCase()}`:null; };
  const rowsOf=(id,depth)=>{ let r=(cov[id]||[]).slice(); if(depth>3) return r; const al=(AL[id]||[]).concat(r.length?[]:(refOf(id)?[refOf(id)]:[])); al.forEach(k=>{ if(k!==id) r=r.concat(rowsOf(k,(depth||0)+1)); }); return [...new Set(r)]; };
  const SX=typeof SHOT_EXTRA!=="undefined"?SHOT_EXTRA:{};
  const stOf=k=>{ if(SX[k]) return "done"; const r=rowsOf(k,0); if(!r.length) return "out"; if(r.some(x=>S(x)==="notshot")) return "ns"; return r.every(x=>S(x)==="done")?"done":"pend"; };
  const inScript=new Set(), rows=[], tot={n:0,inq:0,done:0,ns:0,jp:0,out:0}, outL=[], jpL=[];
  const JRE=typeof JAPAN_RE!=="undefined"?JAPAN_RE:/ญี่ปุ่น/;
  Object.keys(SCRIPT_SCENES).map(Number).sort((a,b)=>a-b).forEach(ep=>{
    const c={ep,n:0,inq:0,done:0,ns:0,jp:0,out:0};
    SCRIPT_SCENES[ep].forEach(sc=>{ inScript.add(sc[0]); c.n++; const st=stOf(sc[0]);
      if(st==="out"){ if(JRE.test(sc[1])){ c.jp++; jpL.push([ep,sc]); } else { c.out++; outL.push([ep,sc]); } }
      else { c.inq++; if(st==="done") c.done++; if(st==="ns") c.ns++; } });
    rows.push(c); Object.keys(tot).forEach(k=>tot[k]+=c[k]);
  });
  const aliased=new Set([].concat(...Object.values(AL)));
  const extra=Object.keys(cov).filter(k=>!inScript.has(k)&&!aliased.has(k));
  const bar=c=>`<div class="sum-bar" aria-hidden="true"><i class="b-done" style="width:${c.n?c.done/c.n*100:0}%"></i><i class="b-ns" style="width:${c.n?c.ns/c.n*100:0}%"></i><i class="b-pend" style="width:${c.n?(c.inq-c.done-c.ns)/c.n*100:0}%"></i></div>`;
  const tr=(c,lab,cls)=>`<tr class="${cls||""}"><td><b>${lab}</b></td><td>${c.n}</td><td>${c.inq}</td><td class="c-done">${c.done}</td><td>${c.inq-c.done}</td><td class="${c.ns?"c-ns":""}">${c.ns}</td><td class="${c.jp?"c-ns":""}">${c.jp}</td><td class="${c.out?"c-out":""}">${c.out}</td><td class="ep-bar">${bar(c)}</td></tr>`;
  const head=sc=>lang==="ja"?(sc[2]||sc[1]):lang==="en"?(sc[3]||sc[1]):sc[1];
  let h=`<section class="sec"><h2>🎞️ ${t(U.serH)}</h2>
    <div class="sum-kpis ser"><div><b>${tot.n}</b><span>${t(U.serTotal)}</span></div><div><b>${tot.inq}</b><span>${t(U.serIn)}</span></div><div class="k-done"><b>${tot.done}</b><span>${t(U.shot)}</span></div><div><b>${tot.n-tot.done}</b><span>${t(U.serLeft)}</span></div></div>
    <div class="sum-pct"><b>${tot.n?Math.round(tot.done/tot.n*100):0}%</b>${bar(tot)}</div>
    <div class="train-scroll"><table class="sum-ep"><thead><tr><th>EP</th><th>${t(U.serScr)}</th><th>${t(U.serQ)}</th><th class="c-done">✓ ${t(U.shot)}</th><th>${t(U.left)}</th><th class="c-ns">✕ ${t(U.nsShort)}</th><th class="c-ns">${t(U.serJp)}</th><th class="c-out">${t(U.serOut)}</th><th></th></tr></thead><tbody>
    ${rows.map(c=>tr(c,"EP."+c.ep)).join("")}${tr(tot,t(U.serSum),"sum-tot")}</tbody></table></div>
    <div class="sum-leg"><span><i class="b-done"></i>${t(U.shot)}</span><span><i class="b-ns"></i>${t(U.notL)}</span><span><i class="b-pend"></i>${t(U.serQ)}</span><span><i></i>${t(U.serJp)} / ${t(U.serOut)}</span></div>
    <p class="sum-note">${t(U.serNote)}${extra.length?` · ${t(U.serExtra)}: ${esc(extra.join(", "))}`:""}</p>
    ${Object.keys(SX).length?`<ul class="ser-sx">${Object.keys(SX).map(k=>`<li><span class="c-done">✓</span> <b>${esc(k)}</b> — ${esc(t(SX[k]))} <small>(${t(U.serSx)})</small></li>`).join("")}</ul>`:""}
    ${[[jpL,"jp",U.serJpH,"jp"],[outL,"out",U.serOutH,"out"]].map(([Lst,key,H,cl])=>Lst.length?`<details class="ser-out ${cl}"${key==="jp"?" open":""}><summary>${t(H)} <b class="ns-n">${Lst.length}</b></summary>
      ${rows.filter(c=>c[key]).map(c=>`<h4>EP.${c.ep} <small>${c[key]}/${c.n}</small></h4><ul>${Lst.filter(o=>o[0]===c.ep).map(o=>`<li><button type="button" class="ns-go" data-scr="${esc(o[1][0])}"><span class="sid">${esc(o[1][0].replace(/^EP\.\d+ /,""))}</span> <span class="ns-pl">${esc(head(o[1]))}</span></button></li>`).join("")}</ul>`).join("")}</details>`:"").join("")}</section>`;
  return h;
}
function notShotSec(d){
  if(!SB) return ""; const U=UI.st, all=allScenes();
  const mine=d?all.filter(x=>x._day===d.day):[], done=mine.filter(x=>(SSTAT[x._k]||{}).status==="done").length;
  const ns=all.filter(x=>(SSTAT[x._k]||{}).status==="notshot");
  const rows=ns.map(x=>`<li><button type="button" class="ns-go" data-stgo="${x._day}|${x._k}"><b>${t(UI.day)} ${x._day}</b> <span class="sid">${esc(x.id)}</span> <span class="ns-pl">${esc(t(x.place))}</span></button>${SSTAT[x._k].note?`<div class="st-note">📝 ${esc(SSTAT[x._k].note)}</div>`:""}</li>`).join("");
  return `<section class="ns-sec${ns.length?" has":""}"><div class="ns-top"><h3>🎬 ${t(U.sumH)} <b class="ns-n">${ns.length}</b></h3>${d?`<button type="button" class="ns-prog" data-tab="6">${t(U.prog).replace("{a}",done).replace("{b}",mine.length)} ›</button>`:""}</div>
    ${d?`<div class="ns-progbar"><i style="width:${mine.length?Math.round(done/mine.length*100):0}%"></i></div>`:""}
    ${ns.length?`<ul class="ns-list">${rows}</ul>`:`<p class="ns-none">${t(U.none)}</p>`}</section>`;
}
let prepTeam="all", PDONE={};

async function loadPrepDone(){ if(!SB) return; try{ const r=await sbFetch("/rest/v1/prepdone?select=id,done"); const m={}; (await r.json()).forEach(x=>{ if(x.done) m[x.id]=1; }); if(JSON.stringify(m)!==JSON.stringify(PDONE)){ PDONE=m; if(tab===3||tab===0) render(); } }catch(e){} }

    ${all.length?`<details class="pall"><summary>${t(UI.prepAll)} (${all.length})</summary><ul class="plist">${all.map(prepItem).join("")}</ul></details>`:""}
    ${!doL.length&&!miss.length&&!all.length?`<p class="lead">–</p>`:""}</section>`;
